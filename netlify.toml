# Netlify builds the Expo web export from this monorepo (site: budgetwise,
# https://budgetwise.temitopeagbola.com). Netlify detects the npm workspace
# and installs from the repository root.
[build]
  base = "apps/web"
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # These values ship inside the public JS bundle by design (Firebase web
  # config, API URL), so Netlify's secret scanner must not fail the build on them.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_API_URL,EXPO_PUBLIC_FIREBASE_API_KEY,EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN,EXPO_PUBLIC_FIREBASE_PROJECT_ID,EXPO_PUBLIC_FIREBASE_APP_ID"

# SPA fallback lives in apps/web/public/_redirects (copied into dist).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit.wasm"
  [headers.values]
    Cache-Control = "public, max-age=604800"
