server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

  # Hashed bundles never change.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /canvaskit.wasm {
    types { application/wasm wasm; }
    add_header Cache-Control "public, max-age=604800";
  }

  # Single-page app: every route serves index.html.
  location / {
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    try_files $uri /index.html;
  }
}
