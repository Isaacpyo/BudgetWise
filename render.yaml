# Render Blueprint for the BudgetWise API (free web service).
# Dashboard → Blueprints → New Blueprint Instance → pick this repo.
# Values marked `sync: false` are prompted for on first deploy; never commit them.
services:
  - type: web
    name: budgetwise-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    # NODE_ENV=production would make npm skip devDependencies, which the build needs.
    buildCommand: >-
      npm ci --include=dev --workspace @budgetwise/api --include-workspace-root=false &&
      npm run build --workspace @budgetwise/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - apps/api/**
        - packages/core/**
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        value: https://budgetwise.temitopeagbola.com
      # "plaid" uses the Plaid sandbox; "mock" uses the built-in sandbox bank (no keys).
      - key: PLAID_PROVIDER
        value: plaid
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      # Firebase service-account JSON (raw or base64) for project budgetwise-*.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Random 256-bit key (base64) for encrypting Plaid access tokens at rest.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SEED_DEMO_ON_START
        value: 'true'
      - key: DEMO_RESEED_HOURS
        value: '6'
